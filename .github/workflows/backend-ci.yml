name: Backend CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.txt

      - name: Compile backend Python
        run: python -m compileall -q backend/app backend/tests

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -t backend

      - name: Install dependency audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit locked backend dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r backend/requirements.txt

  compose-smoke:
    name: Backend Compose health smoke
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start healthy backend stack
        run: docker compose up -d --build --wait --wait-timeout 180 postgres backend

      - name: Verify backend health endpoint
        run: curl --fail --show-error --silent http://127.0.0.1:8000/health

      - name: Show Compose service status
        if: always()
        run: docker compose ps

      - name: Show backend and database logs
        if: failure()
        run: docker compose logs --no-color postgres backend

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
