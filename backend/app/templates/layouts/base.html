<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OpenAssetWatch{% endblock %}</title>
    <style>
        :root {
            --color-primary: #2563eb;
            --color-secondary: #1e40af;
            --color-success: #10b981;
            --color-danger: #ef4444;
            --color-warning: #f59e0b;
            --color-dark: #1f2937;
            --color-light: #f3f4f6;
            --color-border: #e5e7eb;
            --color-text: #111827;
            --color-text-secondary: #6b7280;
            --color-bg: #ffffff;
            --color-bg-secondary: #f9fafb;
            --spacing: 1rem;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            --radius: 0.375rem;
            --radius-lg: 0.5rem;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-dark: #e5e7eb;
                --color-light: #1f2937;
                --color-text: #f3f4f6;
                --color-text-secondary: #9ca3af;
                --color-bg: #111827;
                --color-bg-secondary: #1f2937;
                --color-border: #374151;
            }
        }

        :root[data-theme="dark"] {
            --color-dark: #e5e7eb;
            --color-light: #1f2937;
            --color-text: #f3f4f6;
            --color-text-secondary: #9ca3af;
            --color-bg: #111827;
            --color-bg-secondary: #1f2937;
            --color-border: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--color-text);
            background: var(--color-bg);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        .header {
            background: var(--color-bg-secondary);
            border-bottom: 1px solid var(--color-border);
            padding: var(--spacing-lg) var(--spacing-xl);
            box-shadow: var(--shadow-sm);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: var(--spacing-xl);
        }

        .nav-links a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--color-primary);
        }

        .footer {
            background: var(--color-bg-secondary);
            border-top: 1px solid var(--color-border);
            padding: var(--spacing-xl);
            margin-top: var(--spacing-2xl);
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 0.875rem;
        }

        main {
            min-height: calc(100vh - 200px);
        }

        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-lg);
            }

            .nav-links {
                gap: var(--spacing-lg);
                font-size: 0.9rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if not hide_chrome %}
    <header class="header">
        <nav class="navbar">
            <a href="#dashboard" class="logo">🛡️ OpenAssetWatch</a>
            <ul class="nav-links">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#assets">Assets</a></li>
                <li><a href="#findings">Findings</a></li>
                <li><a href="#settings">Settings</a></li>
            </ul>
        </nav>
    </header>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% if not hide_chrome %}
    <footer class="footer">
        <p>&copy; 2026 OpenAssetWatch. All rights reserved.</p>
    </footer>
    {% endif %}

    {% block extra_js %}{% endblock %}
</body>
</html>
