services:
  postgres:
    image: postgres:16
    container_name: openassetwatch-postgres
    environment:
      POSTGRES_DB: openassetwatch
      POSTGRES_USER: openassetwatch
      POSTGRES_PASSWORD: ${OAW_POSTGRES_PASSWORD:-openassetwatch_local_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openassetwatch -d openassetwatch"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: openassetwatch-control-tower-backend:local
    container_name: openassetwatch-backend
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg2://openassetwatch:${OAW_POSTGRES_PASSWORD:-openassetwatch_local_only_change_me}@postgres:5432/openassetwatch
      OPENASSETWATCH_COLLECTOR_TOKEN: ${OPENASSETWATCH_COLLECTOR_TOKEN:-}
      OPENASSETWATCH_ADMIN_TOKEN: ${OPENASSETWATCH_ADMIN_TOKEN:-}
      OPENASSETWATCH_AI_PROVIDER: ${OPENASSETWATCH_AI_PROVIDER:-demo}
      OPENASSETWATCH_AI_EXTERNAL_ENABLED: ${OPENASSETWATCH_AI_EXTERNAL_ENABLED:-false}
      OPENASSETWATCH_ADVISORY_STAGING_ROOT: /var/lib/openassetwatch/advisory-staging
      OPENASSETWATCH_AI_BASE_URL: ${OPENASSETWATCH_AI_BASE_URL:-}
      OPENASSETWATCH_AI_API_KEY: ${OPENASSETWATCH_AI_API_KEY:-}
      OPENASSETWATCH_AI_MODEL: ${OPENASSETWATCH_AI_MODEL:-}
      OPENASSETWATCH_AI_TIMEOUT_SECONDS: ${OPENASSETWATCH_AI_TIMEOUT_SECONDS:-10}
      OPENASSETWATCH_FINDINGS_SENSOR_STALE_MINUTES: ${OPENASSETWATCH_FINDINGS_SENSOR_STALE_MINUTES:-120}
      OPENASSETWATCH_FINDINGS_ASSET_STALE_HOURS: ${OPENASSETWATCH_FINDINGS_ASSET_STALE_HOURS:-72}
      OPENASSETWATCH_FINDINGS_NEW_ASSET_HOURS: ${OPENASSETWATCH_FINDINGS_NEW_ASSET_HOURS:-24}
      OPENASSETWATCH_FINDINGS_EVIDENCE_FRESH_HOURS: ${OPENASSETWATCH_FINDINGS_EVIDENCE_FRESH_HOURS:-24}
      OPENASSETWATCH_FINDINGS_EVIDENCE_AGING_HOURS: ${OPENASSETWATCH_FINDINGS_EVIDENCE_AGING_HOURS:-72}
      OPENASSETWATCH_FINDINGS_MAX_CANDIDATES: ${OPENASSETWATCH_FINDINGS_MAX_CANDIDATES:-10000}
      OPENASSETWATCH_RISK_WEIGHT_CRITICAL: ${OPENASSETWATCH_RISK_WEIGHT_CRITICAL:-40}
      OPENASSETWATCH_RISK_WEIGHT_HIGH: ${OPENASSETWATCH_RISK_WEIGHT_HIGH:-25}
      OPENASSETWATCH_RISK_WEIGHT_MEDIUM: ${OPENASSETWATCH_RISK_WEIGHT_MEDIUM:-14}
      OPENASSETWATCH_RISK_WEIGHT_LOW: ${OPENASSETWATCH_RISK_WEIGHT_LOW:-7}
      OPENASSETWATCH_RISK_WEIGHT_INFORMATIONAL: ${OPENASSETWATCH_RISK_WEIGHT_INFORMATIONAL:-3}
      OPENASSETWATCH_RISK_CAP_IDENTITY: ${OPENASSETWATCH_RISK_CAP_IDENTITY:-35}
      OPENASSETWATCH_RISK_CAP_COVERAGE: ${OPENASSETWATCH_RISK_CAP_COVERAGE:-30}
      OPENASSETWATCH_RISK_CAP_INVENTORY: ${OPENASSETWATCH_RISK_CAP_INVENTORY:-25}
      OPENASSETWATCH_RISK_CAP_FRESHNESS: ${OPENASSETWATCH_RISK_CAP_FRESHNESS:-20}
      OPENASSETWATCH_RISK_CAP_MOVEMENT: ${OPENASSETWATCH_RISK_CAP_MOVEMENT:-20}
      OPENASSETWATCH_RISK_CAP_VULNERABILITY: ${OPENASSETWATCH_RISK_CAP_VULNERABILITY:-50}
      OPENASSETWATCH_RISK_CAP_OTHER: ${OPENASSETWATCH_RISK_CAP_OTHER:-20}
      OPENASSETWATCH_CONTROL_TOWER_VERSION: ${OPENASSETWATCH_CONTROL_TOWER_VERSION:-0.1.0}
      OPENASSETWATCH_EXPECTED_AGENT_VERSION: ${OPENASSETWATCH_EXPECTED_AGENT_VERSION:-0.1.0}
      OPENASSETWATCH_AGENT_RELEASE_CHANNEL: ${OPENASSETWATCH_AGENT_RELEASE_CHANNEL:-local}
      OPENASSETWATCH_CORS_ORIGINS: ${OPENASSETWATCH_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://127.0.0.1:8000}
    volumes:
      - ./backend:/app:ro
    tmpfs:
      - /var/lib/openassetwatch:mode=0700,size=16777216
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    container_name: openassetwatch-web
    volumes:
      - ./backend/app/static:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  demo-seed:
    profiles: ["demo"]
    build:
      context: ./backend
    image: openassetwatch-control-tower-backend:local
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql+psycopg2://openassetwatch:${OAW_POSTGRES_PASSWORD:-openassetwatch_local_only_change_me}@postgres:5432/openassetwatch
      OPENASSETWATCH_DEMO_SEED_ALLOW_COMPOSE_HOST: "1"
      OPENASSETWATCH_FINDINGS_SENSOR_STALE_MINUTES: ${OPENASSETWATCH_FINDINGS_SENSOR_STALE_MINUTES:-120}
      OPENASSETWATCH_FINDINGS_ASSET_STALE_HOURS: ${OPENASSETWATCH_FINDINGS_ASSET_STALE_HOURS:-72}
      OPENASSETWATCH_FINDINGS_NEW_ASSET_HOURS: ${OPENASSETWATCH_FINDINGS_NEW_ASSET_HOURS:-24}
      OPENASSETWATCH_FINDINGS_EVIDENCE_FRESH_HOURS: ${OPENASSETWATCH_FINDINGS_EVIDENCE_FRESH_HOURS:-24}
      OPENASSETWATCH_FINDINGS_EVIDENCE_AGING_HOURS: ${OPENASSETWATCH_FINDINGS_EVIDENCE_AGING_HOURS:-72}
      OPENASSETWATCH_FINDINGS_MAX_CANDIDATES: ${OPENASSETWATCH_FINDINGS_MAX_CANDIDATES:-10000}
      OPENASSETWATCH_RISK_WEIGHT_CRITICAL: ${OPENASSETWATCH_RISK_WEIGHT_CRITICAL:-40}
      OPENASSETWATCH_RISK_WEIGHT_HIGH: ${OPENASSETWATCH_RISK_WEIGHT_HIGH:-25}
      OPENASSETWATCH_RISK_WEIGHT_MEDIUM: ${OPENASSETWATCH_RISK_WEIGHT_MEDIUM:-14}
      OPENASSETWATCH_RISK_WEIGHT_LOW: ${OPENASSETWATCH_RISK_WEIGHT_LOW:-7}
      OPENASSETWATCH_RISK_WEIGHT_INFORMATIONAL: ${OPENASSETWATCH_RISK_WEIGHT_INFORMATIONAL:-3}
      OPENASSETWATCH_RISK_CAP_IDENTITY: ${OPENASSETWATCH_RISK_CAP_IDENTITY:-35}
      OPENASSETWATCH_RISK_CAP_COVERAGE: ${OPENASSETWATCH_RISK_CAP_COVERAGE:-30}
      OPENASSETWATCH_RISK_CAP_INVENTORY: ${OPENASSETWATCH_RISK_CAP_INVENTORY:-25}
      OPENASSETWATCH_RISK_CAP_FRESHNESS: ${OPENASSETWATCH_RISK_CAP_FRESHNESS:-20}
      OPENASSETWATCH_RISK_CAP_MOVEMENT: ${OPENASSETWATCH_RISK_CAP_MOVEMENT:-20}
      OPENASSETWATCH_RISK_CAP_VULNERABILITY: ${OPENASSETWATCH_RISK_CAP_VULNERABILITY:-50}
      OPENASSETWATCH_RISK_CAP_OTHER: ${OPENASSETWATCH_RISK_CAP_OTHER:-20}
    volumes:
      - .:/workspace:ro
    command: ["python", "scripts/seed_control_tower_demo.py", "--allow-compose-database-host"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
